name: Update Catalog Solution Details

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - 1.0.0.X

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  Catalog:
    uses: SkylineCommunications/SLC-C-Github-Repositories/.github/workflows/Update Catalog Details Workflow.yml@1.0.0.X
    with:
      workspace: "/Documentation/Solution"
    secrets:
      # The API-key: generated in the DCP Admin app (https://admin.dataminer.services/) as authentication for a certain DataMiner System.
      api-key: ${{ secrets.DATAMINER_ORGANISATION_KEY }}